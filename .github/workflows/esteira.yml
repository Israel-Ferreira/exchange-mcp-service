name: Esteira

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26


      - name: Install dependencies
        run: go mod tidy


      - name: Run tests
        run: go test -v ./...


  
